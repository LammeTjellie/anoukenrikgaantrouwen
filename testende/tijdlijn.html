<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anouk & Rik - Onze Reis</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fdfaf7; 
            --gold: #d4af37;
            --text-grey: #a0a0a0;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: #333;
            overflow-x: hidden;
        }

        /* Intro Scherm volgens jouw afbeelding */
        .intro-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .intro-screen h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 12vw, 5.5rem);
            font-weight: 400;
            margin: 0;
            color: #2c2c2c;
        }

        .intro-screen p {
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.8rem, 3vw, 1.1rem);
            text-transform: uppercase;
            letter-spacing: 6px;
            color: var(--text-grey);
            margin-top: 5px;
        }

        .scroll-container {
            position: relative;
            width: 100%;
            padding-top: 20vh; /* De reis begint rustig onder de intro */
        }

        .wavy-line-svg {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px; 
            height: 100%;
            z-index: 1;
            fill: none;
            stroke: var(--gold);
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        .milestone {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-bottom: 80vh; /* Ruimte tussen de punten voor de lijn */
        }

        .milestone.spacing-xl { margin-bottom: 150vh; }

        .content-box {
            padding: 40px 20px;
            background-color: var(--bg-color); 
            max-width: 700px;
            width: 90%;
        }

        .milestone-img {
            width: 100%;
            max-width: 500px;
            height: auto;
            border-radius: 8px;
            margin-top: 30px;
            opacity: 0;
            transform: translateY(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .date { 
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem; 
            letter-spacing: 4px; 
            color: var(--gold); 
            text-transform: uppercase; 
            display: block; 
            margin-bottom: 15px;
            opacity: 0;
        }

        h3 { 
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 8vw, 3rem); 
            margin: 0 0 15px 0; 
            font-weight: 400;
        }

        p.description { 
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem; 
            line-height: 1.6; 
            color: #555;
            max-width: 500px;
            margin: 0 auto;
        }

        .final-screen {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="intro-screen">
        <h1>Anouk & Rik</h1>
        <p>GAAN TROUWEN</p>
    </div>

    <div class="scroll-container">
        <svg class="wavy-line-svg" id="svgContainer" preserveAspectRatio="none">
            <path id="wavyPath" d="" />
        </svg>

        <div class="milestone">
            <div class="content-box">
                <span class="date">Februari 2018</span>
                <h3 class="typewriter">De Eerste Ontmoeting</h3>
                <p class="description typewriter-p">Waar de vonk oversloeg in dat kleine cafeetje.</p>
                <img src="https://picsum.photos/seed/love1/800/500" class="milestone-img">
            </div>
        </div>

        <div class="milestone spacing-xl">
            <div class="content-box">
                <span class="date">Juni 2018</span>
                <h3 class="typewriter">Eerste Vakantie</h3>
                <p class="description typewriter-p">Verliefd worden onder de Franse zon.</p>
                <img src="https://picsum.photos/seed/travel2/800/500" class="milestone-img">
            </div>
        </div>

        <div class="milestone final-screen">
            <div class="content-box">
                <h2 style="font-family: 'Playfair Display', serif; font-size: 3.5rem; color: var(--gold);">Tot snel!</h2>
                <p style="font-family: 'Inter', sans-serif; letter-spacing: 3px;">WIJ KUNNEN NIET WACHTEN</p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/TextPlugin.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollToPlugin, TextPlugin);

        const container = document.querySelector('.scroll-container');
        const wavyPath = document.getElementById('wavyPath');
        const milestones = document.querySelectorAll('.milestone');

        function drawLine() {
            const height = container.offsetHeight;
            let pathData = "M 50 0 "; 
            for (let i = 0; i <= height; i += 10) {
                let x = 50 + Math.sin(i / 150) * 35; 
                pathData += `L ${x} ${i} `;
            }
            wavyPath.setAttribute('d', pathData);
            return wavyPath.getTotalLength();
        }

        const pathLength = drawLine();
        gsap.set(wavyPath, { strokeDasharray: pathLength, strokeDashoffset: pathLength });

        const tl = gsap.timeline({
            onComplete: () => {
                document.body.style.overflowY = "auto";
            }
        });

        document.body.style.overflow = "hidden";

        milestones.forEach((m, index) => {
            const title = m.querySelector('.typewriter');
            const text = m.querySelector('.typewriter-p');
            const date = m.querySelector('.date');
            const img = m.querySelector('.milestone-img');
            
            const originalTitle = title ? title.innerText : "";
            const originalText = text ? text.innerText : "";
            if(title) title.innerText = "";
            if(text) text.innerText = "";

            // We scrollen nu naar de bovenkant van het blok met een kleine offset (15% van scherm)
            // Zo staat de tekst altijd goed in beeld, ook op mobiel.
            const scrollPos = m.offsetTop - (window.innerHeight * 0.15);
            const lineStop = m.offsetTop + (m.offsetHeight / 2);
            const relativeDraw = pathLength * (lineStop / container.offsetHeight);

            tl.to(window, {
                scrollTo: { y: scrollPos, autoKill: false },
                duration: 2.5,
                ease: "power2.inOut"
            })
            .to(wavyPath, {
                strokeDashoffset: pathLength - relativeDraw,
                duration: 2.2,
                ease: "none"
            }, "-=2.5")
            .to(date, { opacity: 1, duration: 0.5 })
            .to(title, { text: originalTitle, duration: 1.2, ease: "none" })
            .to(text, { text: originalText, duration: 1.5, ease: "none" });

            if(img) {
                tl.to(img, { opacity: 1, y: 0, duration: 0.8 }, "-=0.5");
            }

            tl.to({}, { duration: 2 });
        });

        window.addEventListener('resize', () => drawLine());
    </script>
</body>
</html>
