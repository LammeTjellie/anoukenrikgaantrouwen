<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anouk & Rik - Onze Reis</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fdfaf7; 
            --gold: #d4af37;
            --text-grey: #a0a0a0;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: #4a4a4a;
            overflow-x: hidden;
        }

        /* Intro Scherm */
        .intro-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: var(--bg-color);
        }

        .intro-screen h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 12vw, 5.5rem);
            margin: 0;
            color: #2c2c2c;
            font-weight: 400;
        }

        .intro-screen p {
            font-size: clamp(0.8rem, 3vw, 1.1rem);
            text-transform: uppercase;
            letter-spacing: 6px;
            color: var(--text-grey);
            margin-top: 10px;
        }

        .scroll-container {
            position: relative;
            width: 100%;
            /* Lange aanloop naar de eerste tekst */
            padding-top: 120vh; 
            padding-bottom: 100vh;
        }

        .wavy-line-svg {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px; 
            height: 100%;
            z-index: 1;
            fill: none;
            stroke: var(--gold);
            stroke-width: 2.5;
        }

        .milestone {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 120vh; /* Ruimte per punt */
            text-align: center;
        }

        .content-box {
            display: inline-block;
            background-color: var(--bg-color);
            padding: 20px 40px;
            /* Dwing de tekst naar de bovenkant van de milestone */
            margin-top: 10vh; 
            max-width: 85%;
            box-shadow: 0 0 50px 30px var(--bg-color); /* Zorgt dat de lijn achter de tekst wegvalt */
        }

        .date { 
            font-size: 0.8rem; 
            letter-spacing: 4px; 
            color: var(--gold); 
            text-transform: uppercase; 
            display: block; 
            margin-bottom: 10px;
            opacity: 0;
        }

        h3 { 
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 8vw, 3rem); 
            margin: 5px 0 15px 0; 
            font-weight: 400; 
            color: #222;
        }

        p.description { 
            font-size: clamp(1.1rem, 4vw, 1.3rem); 
            line-height: 1.6; 
            max-width: 550px; 
            margin: 0 auto;
            opacity: 0;
        }

        .final-screen { height: 100vh; }
    </style>
</head>
<body>

    <div class="intro-screen">
        <h1>Anouk & Rik</h1>
        <p>Gaan Trouwen</p>
    </div>

    <div class="scroll-container">
        <svg class="wavy-line-svg" id="svgContainer" preserveAspectRatio="none">
            <path id="wavyPath" d="" />
        </svg>

        <div class="milestone">
            <div class="content-box">
                <span class="date">Februari 2018</span>
                <h3 class="typewriter">De Eerste Ontmoeting</h3>
                <p class="description">Waar het allemaal begon, in dat kleine cafeetje.</p>
            </div>
        </div>

        <div class="milestone">
            <div class="content-box">
                <span class="date">Juni 2018</span>
                <h3 class="typewriter">Onze Eerste Reis</h3>
                <p class="description">Samen de wereld ontdekken in Frankrijk.</p>
            </div>
        </div>

        <div class="milestone final-screen">
            <div class="content-box" style="margin-top: 20vh;">
                <h2 style="font-family: 'Playfair Display', serif; font-size: 3.5rem; color: var(--gold);">Tot snel!</h2>
                <p style="text-transform: uppercase; letter-spacing: 4px;">Wij kunnen niet wachten</p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/TextPlugin.min.js"></script>

    <script>
        window.onload = () => {
            gsap.registerPlugin(ScrollToPlugin, TextPlugin);

            const container = document.querySelector('.scroll-container');
            const wavyPath = document.getElementById('wavyPath');
            const milestones = document.querySelectorAll('.milestone');

            function drawLine() {
                const height = container.offsetHeight;
                let pathData = "M 40 0 "; 
                for (let i = 0; i <= height; i += 10) {
                    let x = 40 + Math.sin(i / 150) * 30; 
                    pathData += `L ${x} ${i} `;
                }
                wavyPath.setAttribute('d', pathData);
                return wavyPath.getTotalLength();
            }

            const pathLength = drawLine();
            gsap.set(wavyPath, { strokeDasharray: pathLength, strokeDashoffset: pathLength });

            // Start de animatie pas na een korte delay voor stabiliteit
            setTimeout(() => {
                const tl = gsap.timeline({
                    onComplete: () => {
                        document.body.style.overflowY = "auto";
                    }
                });

                document.body.style.overflow = "hidden";

                milestones.forEach((m, index) => {
                    const title = m.querySelector('.typewriter');
                    const text = m.querySelector('.description');
                    const date = m.querySelector('.date');
                    
                    const originalTitle = title ? title.innerText : "";
                    if(title) title.innerText = "";

                    // Forceer scrollen naar de top van de milestone
                    const scrollPos = m.offsetTop;

                    tl.to(window, {
                        scrollTo: { y: scrollPos, autoKill: false },
                        duration: 3,
                        ease: "power2.inOut"
                    })
                    .to(wavyPath, {
                        strokeDashoffset: pathLength - (pathLength * (m.offsetTop / container.offsetHeight)),
                        duration: 2.8,
                        ease: "none"
                    }, "-=3")
                    .to(date, { opacity: 1, duration: 0.5 })
                    .to(title, { text: originalTitle, duration: 1.2, ease: "none" })
                    .to(text, { opacity: 1, duration: 0.8 })
                    .to({}, { duration: 2 });
                });
            }, 500);

            window.addEventListener('resize', () => drawLine());
        };
    </script>
</body>
</html>
