<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onze Reis - Perfect Centered</title>
    
    <style>
        :root {
            --bg-color: #fdfaf7; 
            --gold: #d4af37;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            font-family: 'optima', 'georgia', serif;
            color: #4a4a4a;
            overflow: hidden; /* Wordt door JS pas aan het eind op 'auto' gezet */
        }

        /* Intro scherm */
        .intro-screen {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .scroll-container {
            position: relative;
            width: 100%;
            /* Padding top zorgt dat de lijn eerst een stukje loopt */
            padding-top: 50vh; 
        }

        .wavy-line-svg {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px; 
            height: 100%; /* De SVG beslaat de hele container */
            z-index: 1;
            fill: none;
            stroke: var(--gold);
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        .milestone {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh; /* Elk punt vult exact één schermhoogte */
            display: flex;
            justify-content: center; /* Horizontaal midden */
            align-items: center;     /* Verticaal midden */
            text-align: center;
        }

        .content-box {
            padding: 40px;
            background-color: var(--bg-color); 
            max-width: 800px;
            width: 90%;
        }

        .milestone-img {
            width: 100%;
            max-width: 500px;
            height: auto;
            border-radius: 15px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            opacity: 0;
            transform: translateY(20px);
        }

        .date { 
            font-size: 1rem; 
            letter-spacing: 4px; 
            color: var(--gold); 
            text-transform: uppercase; 
            display: block; 
            margin-bottom: 15px;
            opacity: 0;
        }

        h3 { font-size: clamp(2rem, 8vw, 3.5rem); margin: 0 0 20px 0; font-weight: normal; color: #222; }
        p { font-size: clamp(1.1rem, 4vw, 1.4rem); line-height: 1.6; margin: 0 auto; }

        /* Afstanden tussen de milestones aanpassen door lege ruimte */
        .gap { height: 50vh; }
        .gap.large { height: 120vh; }
        .gap.xl { height: 200vh; }
    </style>
</head>
<body>

    <div class="intro-screen">
        <div>
            <h1 style="font-size: clamp(2.5rem, 10vw, 5rem);">Onze Reis</h1>
            <p>Samen onderweg naar de grote dag</p>
        </div>
    </div>

    <div class="scroll-container">
        <svg class="wavy-line-svg" id="svgContainer" preserveAspectRatio="none">
            <path id="wavyPath" d="" />
        </svg>

        <div class="milestone">
            <div class="content-box">
                <span class="date">Feb 2018</span>
                <h3 class="typewriter">De Eerste Ontmoeting</h3>
                <p class="typewriter-p">Waar de vonk oversloeg in dat kleine cafeetje.</p>
                <img src="https://picsum.photos/seed/wedding1/800/500" class="milestone-img">
            </div>
        </div>

        <div class="gap large"></div> <div class="milestone">
            <div class="content-box">
                <span class="date">Juni 2018</span>
                <h3 class="typewriter">Eerste Vakantie</h3>
                <p class="typewriter-p">Verliefd worden onder de Franse zon.</p>
                <img src="https://picsum.photos/seed/holiday/800/500" class="milestone-img">
            </div>
        </div>

        <div class="gap xl"></div>

        <div class="milestone" id="final">
            <div class="content-box">
                <h2 style="font-size: clamp(2.5rem, 8vw, 4rem); color: var(--gold);">Tot snel!</h2>
                <p>Wij kunnen niet wachten om dit met jullie te vieren.</p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/TextPlugin.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollToPlugin, TextPlugin);

        const container = document.querySelector('.scroll-container');
        const wavyPath = document.getElementById('wavyPath');
        const milestones = document.querySelectorAll('.milestone');

        function drawLine() {
            const height = container.offsetHeight;
            let pathData = "M 50 0 "; 
            for (let i = 0; i <= height; i += 10) {
                let x = 50 + Math.sin(i / 100) * 35; 
                pathData += `L ${x} ${i} `;
            }
            wavyPath.setAttribute('d', pathData);
            return wavyPath.getTotalLength();
        }

        const pathLength = drawLine();
        gsap.set(wavyPath, { strokeDasharray: pathLength, strokeDashoffset: pathLength });

        const tl = gsap.timeline({
            onComplete: () => {
                document.body.style.overflowY = "auto";
            }
        });

        milestones.forEach((m, index) => {
            const title = m.querySelector('.typewriter');
            const text = m.querySelector('.typewriter-p');
            const date = m.querySelector('.date');
            const img = m.querySelector('.milestone-img');
            
            const originalTitle = title ? title.innerText : "";
            const originalText = text ? text.innerText : "";
            if(title) title.innerText = "";
            if(text) text.innerText = "";

            // Bereken het punt waar de lijn moet stoppen (precies in het midden van het blok)
            const rect = m.getBoundingClientRect();
            const scrollTarget = m.offsetTop;
            const drawTarget = m.offsetTop + (m.offsetHeight / 2);
            const relativeDraw = pathLength * (drawTarget / container.offsetHeight);

            tl.to(window, {
                scrollTo: { y: scrollTarget, offsetY: 0 },
                duration: 3,
                ease: "power2.inOut"
            })
            .to(wavyPath, {
                strokeDashoffset: pathLength - relativeDraw,
                duration: 2.8,
                ease: "power1.inOut"
            }, "-=3");

            if(date) tl.to(date, { opacity: 1, duration: 0.5 });
            if(title) tl.to(title, { text: originalTitle, duration: 1.2, ease: "none" });
            if(text) tl.to(text, { text: originalText, duration: 1.5, ease: "none" });
            if(img) tl.to(img, { opacity: 1, y: 0, duration: 1 }, "-=0.5");

            tl.to({}, { duration: 2 });
        });

        window.addEventListener('resize', () => drawLine());
    </script>
</body>
</html>
