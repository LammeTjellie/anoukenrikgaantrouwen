<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anouk & Rik - Onze Reis</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fdfaf7; 
            --gold: #d4af37;
            --text-grey: #a0a0a0;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: #4a4a4a;
            overflow-x: hidden;
        }

        /* Intro Scherm */
        .intro-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .intro-screen h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 12vw, 5.5rem);
            font-weight: 400;
            margin: 0;
            color: #2c2c2c;
        }

        .intro-screen p {
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.8rem, 3vw, 1.1rem);
            text-transform: uppercase;
            letter-spacing: 6px;
            color: var(--text-grey);
            margin: 10px 0 0 0;
        }

        .scroll-container {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Lange aanloop naar eerste punt */
            padding-top: 120vh; 
        }

        .wavy-line-svg {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px; 
            height: 100%;
            z-index: 1;
            fill: none;
            stroke: var(--gold);
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        .milestone {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 90%;
            display: flex;
            justify-content: center;
            /* Geen align-items center meer, zodat we grip hebben op de hoogte */
            margin-bottom: 100vh; 
        }

        .content-box {
            padding: 10px; /* Minder padding zodat tekst minder ruimte inneemt */
            background-color: var(--bg-color); 
            width: 100%;
        }

        .date { 
            font-size: 0.9rem; 
            letter-spacing: 4px; 
            color: var(--gold); 
            text-transform: uppercase; 
            display: block; 
            margin-bottom: 10px;
            opacity: 0;
        }

        h3 { 
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 7vw, 3rem); 
            margin: 0 0 15px 0; 
            font-weight: 400; 
            color: #222;
        }

        p.description { 
            font-size: clamp(1rem, 4vw, 1.25rem); 
            line-height: 1.5; 
            max-width: 600px; 
            margin: 0 auto;
        }

        .final-screen {
            height: 100vh;
            display: flex;
            align-items: flex-start; /* Zorgt dat 'Tot Snel' ook hoog begint */
            padding-top: 20vh;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="intro-screen">
        <div>
            <h1>Anouk & Rik</h1>
            <p>Gaan Trouwen</p>
        </div>
    </div>

    <div class="scroll-container">
        <svg class="wavy-line-svg" id="svgContainer" preserveAspectRatio="none">
            <path id="wavyPath" d="" />
        </svg>

        <div class="milestone">
            <div class="content-box">
                <span class="date">Feb 2018</span>
                <h3 class="typewriter">De Eerste Ontmoeting</h3>
                <p class="description typewriter-p">Waar de vonk oversloeg in dat kleine cafeetje.</p>
            </div>
        </div>

        <div class="milestone final-screen">
            <div class="content-box">
                <h2 style="font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 8vw, 4rem); color: var(--gold);">Tot snel!</h2>
                <p style="text-transform: uppercase; letter-spacing: 3px;">Wij kunnen niet wachten</p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/TextPlugin.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollToPlugin, TextPlugin);

        const container = document.querySelector('.scroll-container');
        const wavyPath = document.getElementById('wavyPath');
        const milestones = document.querySelectorAll('.milestone');

        function drawLine() {
            const height = container.offsetHeight;
            let pathData = "M 50 0 "; 
            for (let i = 0; i <= height; i += 10) {
                let x = 50 + Math.sin(i / 150) * 35; 
                pathData += `L ${x} ${i} `;
            }
            wavyPath.setAttribute('d', pathData);
            return wavyPath.getTotalLength();
        }

        const pathLength = drawLine();
        gsap.set(wavyPath, { strokeDasharray: pathLength, strokeDashoffset: pathLength });

        const tl = gsap.timeline({
            onComplete: () => {
                document.body.style.overflowY = "auto";
            }
        });

        document.body.style.overflow = "hidden";

        milestones.forEach((m, index) => {
            const title = m.querySelector('.typewriter');
            const text = m.querySelector('.description');
            const date = m.querySelector('.date');
            
            const originalTitle = title ? title.innerText : "";
            const originalText = text ? text.innerText : "";
            if(title) title.innerText = "";
            if(text) text.innerText = "";

            const scrollPos = m.offsetTop;
            // De lijn tekent tot het midden van het blok
            const lineDrawPoint = m.offsetTop + (m.offsetHeight / 2);
            const relativeDraw = pathLength * (lineDrawPoint / container.offsetHeight);

            tl.to(window, {
                // VERHOOGD naar 300px: Hoe hoger dit getal, hoe hoger de tekst op je scherm komt te staan.
                scrollTo: { y: scrollPos, offsetY: 300, autoKill: false },
                duration: 3,
                ease: "power2.inOut"
            })
            .to(wavyPath, {
                strokeDashoffset: pathLength - relativeDraw,
                duration: 2.8,
                ease: "power1.inOut"
            }, "-=3")
            .to(date, { opacity: 1, duration: 0.5 })
            .to(title, { text: originalTitle, duration: 1.2, ease: "none" })
            .to(text, { text: originalText, duration: 1.5, ease: "none" })
            .to({}, { duration: 2 });
        });

        window.addEventListener('resize', () => drawLine());
    </script>
</body>
</html>
