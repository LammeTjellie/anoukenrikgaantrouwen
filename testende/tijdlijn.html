<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anouk & Rik - Onze Reis</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fdfaf7; 
            --gold: #d4af37;
            --text-grey: #8e8e8e;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: #333;
            overflow: hidden; /* We blokkeren handmatig scrollen tijdens de intro */
            -webkit-font-smoothing: antialiased;
        }

        /* De specifieke styling voor de Intro (zoals je plaatje) */
        .intro-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .intro-screen h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 12vw, 5.5rem);
            font-weight: 600;
            margin: 0;
            color: #2c2c2c;
        }

        .intro-screen p {
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--text-grey);
            margin-top: 10px;
        }

        .scroll-container {
            position: relative;
            width: 100%;
            /* Padding top op 100vh zorgt dat de lijn eerst een heel scherm doorloopt */
            padding-top: 100vh; 
        }

        .wavy-line-svg {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px; 
            height: 100%;
            z-index: 1;
            fill: none;
            stroke: var(--gold);
            stroke-width: 2;
        }

        .milestone {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh; /* Forceert elk punt precies op schermhoogte */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .content-box {
            padding: 30px;
            background-color: var(--bg-color); /* Maskeert de lijn */
            max-width: 600px;
            width: 85%;
        }

        .date { 
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem; 
            letter-spacing: 3px; 
            color: var(--gold); 
            text-transform: uppercase; 
            display: block; 
            margin-bottom: 15px;
            opacity: 0;
        }

        h3 { 
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 7vw, 2.8rem); 
            margin: 0 0 15px 0; 
            font-weight: 600;
        }

        p.description { 
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem; 
            line-height: 1.6; 
            color: #555;
            margin: 0 auto;
        }

        .milestone-img {
            width: 100%;
            max-width: 450px;
            height: auto;
            border-radius: 10px;
            margin-top: 25px;
            opacity: 0;
            transform: translateY(20px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.07);
        }

        /* Gaps voor meer golven */
        .gap { height: 100vh; }
    </style>
</head>
<body>

    <div class="intro-screen">
        <h1>Anouk & Rik</h1>
        <p>Gaan Trouwen</p>
    </div>

    <div class="scroll-container">
        <svg class="wavy-line-svg" id="svgContainer" preserveAspectRatio="none">
            <path id="wavyPath" d="" />
        </svg>

        <div class="milestone">
            <div class="content-box">
                <span class="date">Feb 2018</span>
                <h3 class="typewriter">De Eerste Ontmoeting</h3>
                <p class="description typewriter-p">Waar de vonk oversloeg in dat kleine cafeetje.</p>
                <img src="https://picsum.photos/seed/love1/800/500" class="milestone-img">
            </div>
        </div>

        <div class="gap"></div>

        <div class="milestone">
            <div class="content-box">
                <span class="date">Juni 2018</span>
                <h3 class="typewriter">Eerste Vakantie</h3>
                <p class="description typewriter-p">Verliefd worden onder de Franse zon.</p>
                <img src="https://picsum.photos/seed/travel/800/500" class="milestone-img">
            </div>
        </div>

        <div class="gap"></div>

        <div class="milestone" id="final">
            <div class="content-box">
                <h2 style="font-family: 'Playfair Display', serif; font-size: 3rem; color: var(--gold);">Tot snel!</h2>
                <p style="font-family: 'Inter', sans-serif; letter-spacing: 2px; text-transform: uppercase;">Wij kunnen niet wachten</p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/TextPlugin.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollToPlugin, TextPlugin);

        const container = document.querySelector('.scroll-container');
        const wavyPath = document.getElementById('wavyPath');
        const milestones = document.querySelectorAll('.milestone');

        // Lijn tekenen
        function drawLine() {
            const height = container.offsetHeight;
            let pathData = "M 40 0 "; 
            for (let i = 0; i <= height; i += 10) {
                let x = 40 + Math.sin(i / 150) * 30; 
                pathData += `L ${x} ${i} `;
            }
            wavyPath.setAttribute('d', pathData);
            return wavyPath.getTotalLength();
        }

        const pathLength = drawLine();
        gsap.set(wavyPath, { strokeDasharray: pathLength, strokeDashoffset: pathLength });

        // Animatie Sequence
        const tl = gsap.timeline({
            onComplete: () => {
                document.body.style.overflowY = "auto";
            }
        });

        milestones.forEach((m, index) => {
            const title = m.querySelector('.typewriter');
            const text = m.querySelector('.typewriter-p');
            const date = m.querySelector('.date');
            const img = m.querySelector('.milestone-img');
            
            const originalTitle = title ? title.innerText : "";
            const originalText = text ? text.innerText : "";
            if(title) title.innerText = "";
            if(text) text.innerText = "";

            // Berekening voor centreren: we scrollen naar de TOP van de milestone
            // Omdat de milestone 100vh is, staat de content dan exact in het midden.
            const scrollTarget = m.offsetTop;
            const drawTarget = m.offsetTop + (window.innerHeight / 2);
            const relativeDraw = pathLength * (drawTarget / container.offsetHeight);

            tl.to(window, {
                scrollTo: { y: scrollTarget, autoKill: false },
                duration: 3,
                ease: "power2.inOut"
            })
            .to(wavyPath, {
                strokeDashoffset: pathLength - relativeDraw,
                duration: 2.8,
                ease: "power1.inOut"
            }, "-=3");

            if(date) tl.to(date, { opacity: 1, duration: 0.5 });
            if(title) tl.to(title, { text: originalTitle, duration: 1.2, ease: "none" });
            if(text) tl.to(text, { text: originalText, duration: 1.5, ease: "none" });
            if(img) tl.to(img, { opacity: 1, y: 0, duration: 1 }, "-=0.5");

            tl.to({}, { duration: 2.5 }); // Wachttijd om te lezen
        });

        window.addEventListener('resize', () => drawLine());
    </script>
</body>
</html>
